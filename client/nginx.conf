server {
  listen 5173;
  root /usr/share/nginx/html;

  # React Router handles paths like /admin/board, so unknown paths get index.html
  location / {
    try_files $uri /index.html;
  }

  # Service worker files must never be cached, or the app could not update itself
  location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }
}
