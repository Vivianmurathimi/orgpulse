name: orgpulse

# Settings shared by the 4 services. "<<: *service-env" below pastes them in.
x-service-env: &service-env
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
  INTERNAL_KEY: ${INTERNAL_KEY:-dev-internal-key-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orgpulse
      POSTGRES_PASSWORD: orgpulse
      POSTGRES_DB: orgpulse
    ports:
      - "5433:5432" # 5433 on the Mac, 5432 inside Docker
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgpulse -d orgpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      <<: *service-env
      PORT: 4001
      DATABASE_URL: postgresql://orgpulse:orgpulse@postgres:5432/orgpulse?schema=auth
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &service-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  rules-service:
    build: ./services/rules-service
    environment:
      <<: *service-env
      PORT: 4002
      DATABASE_URL: postgresql://orgpulse:orgpulse@postgres:5432/orgpulse?schema=rules
      AUTH_SERVICE_URL: http://auth-service:4001
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *service-health

  scheduler-service:
    build: ./services/scheduler-service
    environment:
      <<: *service-env
      PORT: 4003
      DATABASE_URL: postgresql://orgpulse:orgpulse@postgres:5432/orgpulse?schema=scheduler
      AUTH_SERVICE_URL: http://auth-service:4001
      RULES_SERVICE_URL: http://rules-service:4002
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *service-health

  notification-service:
    build: ./services/notification-service
    environment:
      <<: *service-env
      PORT: 4004
      DATABASE_URL: postgresql://orgpulse:orgpulse@postgres:5432/orgpulse?schema=notification
      AUTH_SERVICE_URL: http://auth-service:4001
    ports:
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *service-health

  gateway:
    build: ./gateway
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      CLIENT_ORIGIN: http://localhost:5173
      AUTH_SERVICE_URL: http://auth-service:4001
      RULES_SERVICE_URL: http://rules-service:4002
      SCHEDULER_SERVICE_URL: http://scheduler-service:4003
      NOTIFICATION_SERVICE_URL: http://notification-service:4004
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      rules-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck: *service-health

volumes:
  postgres-data:
